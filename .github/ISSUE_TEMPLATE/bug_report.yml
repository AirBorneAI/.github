name: 🐛 Bug Report
description: File an actionable bug report to help us improve AirBorne HRS software
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: input
    id: version
    attributes:
      label: Software / Package Version
      description: What version of the software are you running?
      placeholder: e.g. v1.4.2
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Provide a clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction Steps
      description: Step-by-step instructions to reproduce the behavior.
      placeholder: |
        1. Initialize module with ...
        2. Execute method ...
        3. Observe error ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Log Output
      description: Please copy and paste any relevant log output or stack traces.
      render: shell

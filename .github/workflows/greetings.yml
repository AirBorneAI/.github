name: "👋 Organization Welcome Bot"

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

jobs:
  welcome:
    name: 🤖 Greet Contributor
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write

    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: "⚡ **Welcome to AirBorne!** 🦅\n\nThank you for reaching out to the **AirBorneAI** organization. Our engineering leads will review your ticket shortly.\n\n*Intelligence. Automation. Elevated.*"
          pr-message: "⚡ **Welcome to AirBorne!** 🚀\n\nThank you for submitting your contribution to the **AirBorneAI** organization! Our automated checks are validating your changes. A maintainer will conduct a code review soon.\n\n*BUILT FOR THE FUTURE. ENGINEERED TO LEAD. ELEVATED BY AIRBORNE.*"

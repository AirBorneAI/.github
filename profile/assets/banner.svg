<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14" />
      <stop offset="50%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Accent Glows -->
    <radialGradient id="cyanGlow" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="purpleGlow" cx="80%" cy="70%" r="55%">
      <stop offset="0%" stop-color="#7928CA" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#7928CA" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="blueGlow" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#0070F3" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0070F3" stop-opacity="0" />
    </radialGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#E2F1FF" />
      <stop offset="70%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#7000FF" />
    </linearGradient>

    <!-- Pill Gradient -->
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#7000FF" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0" />
      <stop offset="50%" stop-color="#00F0FF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#7000FF" stop-opacity="0" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.4" />
      <circle cx="40" cy="40" r="1" fill="#00F0FF" fill-opacity="0.3" />
    </pattern>

    <!-- Filter Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)" rx="16" />
  
  <!-- Subtle Grid Overlay -->
  <rect width="1200" height="420" fill="url(#cyberGrid)" rx="16" />

  <!-- Ambient Light Spheres -->
  <rect width="1200" height="420" fill="url(#cyanGlow)" rx="16" />
  <rect width="1200" height="420" fill="url(#purpleGlow)" rx="16" />
  <rect width="1200" height="420" fill="url(#blueGlow)" rx="16" />

  <!-- Outer Border Stroke -->
  <rect x="1" y="1" width="1198" height="418" rx="15" fill="none" stroke="#334155" stroke-width="1.2" stroke-opacity="0.6" />

  <!-- Geometric Tech Accent Lines -->
  <path d="M 60 40 L 1140 40" stroke="url(#lineGrad)" stroke-width="1" />
  <path d="M 60 380 L 1140 380" stroke="url(#lineGrad)" stroke-width="1" />

  <!-- Corner Brackets -->
  <path d="M 40 60 L 40 40 L 60 40" fill="none" stroke="#00F0FF" stroke-width="2" stroke-linecap="round" />
  <path d="M 1160 60 L 1160 40 L 1140 40" fill="none" stroke="#00F0FF" stroke-width="2" stroke-linecap="round" />
  <path d="M 40 360 L 40 380 L 60 380" fill="none" stroke="#7000FF" stroke-width="2" stroke-linecap="round" />
  <path d="M 1160 360 L 1160 380 L 1140 380" fill="none" stroke="#7000FF" stroke-width="2" stroke-linecap="round" />

  <!-- Hexagon Tech Nodes (Left Accent) -->
  <g transform="translate(90, 160)" opacity="0.35">
    <polygon points="30,0 60,17 60,52 30,70 0,52 0,17" fill="none" stroke="#00F0FF" stroke-width="1.5" />
    <polygon points="80,40 110,57 110,92 80,110 50,92 50,57" fill="none" stroke="#7000FF" stroke-width="1.5" />
    <circle cx="30" cy="35" r="3" fill="#00F0FF" />
    <line x1="60" y1="35" x2="80" y2="75" stroke="#00F0FF" stroke-width="1" stroke-dasharray="3,3" />
  </g>

  <!-- Constellation Tech Nodes (Right Accent) -->
  <g transform="translate(1030, 150)" opacity="0.35">
    <circle cx="20" cy="20" r="4" fill="#00F0FF" />
    <circle cx="80" cy="50" r="5" fill="#7000FF" />
    <circle cx="40" cy="90" r="3" fill="#00F0FF" />
    <line x1="20" y1="20" x2="80" y2="50" stroke="#00F0FF" stroke-width="1" />
    <line x1="80" y1="50" x2="40" y2="90" stroke="#7000FF" stroke-width="1" />
    <line x1="40" y1="90" x2="20" y2="20" stroke="#334155" stroke-width="1" stroke-dasharray="2,2" />
  </g>

  <!-- Tag Pill -->
  <g transform="translate(600, 95)">
    <rect x="-190" y="-16" width="380" height="32" rx="16" fill="url(#pillGrad)" stroke="#00F0FF" stroke-width="1" stroke-opacity="0.5" />
    <circle cx="-165" cy="0" r="4" fill="#00F0FF" filter="url(#glow)" />
    <text x="-148" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#00F0FF" letter-spacing="3">ENTERPRISE TALENT INTELLIGENCE</text>
  </g>

  <!-- Brand Title -->
  <text x="600" y="195" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Montserrat', 'Inter', sans-serif" font-size="64" font-weight="900" letter-spacing="6" fill="url(#titleGrad)" filter="url(#glow)">
    AIRBORNE HRS
  </text>

  <!-- Subtitle -->
  <text x="600" y="242" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="18" font-weight="400" fill="#94A3B8" letter-spacing="1.5">
    Architecting Autonomous Systems for Next-Generation Human Capital &amp; Enterprise Scale
  </text>

  <!-- Feature Metric Pills -->
  <g transform="translate(600, 310)">
    <!-- Pill 1 -->
    <g transform="translate(-360, 0)">
      <rect x="-95" y="-18" width="190" height="36" rx="18" fill="#0B132B" stroke="#1E293B" stroke-width="1" />
      <circle cx="-72" cy="0" r="4" fill="#00F0FF" />
      <text x="-58" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#E2E8F0">AI Matching Engine</text>
    </g>

    <!-- Pill 2 -->
    <g transform="translate(-120, 0)">
      <rect x="-95" y="-18" width="190" height="36" rx="18" fill="#0B132B" stroke="#1E293B" stroke-width="1" />
      <circle cx="-72" cy="0" r="4" fill="#7000FF" />
      <text x="-58" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#E2E8F0">HRMS Operating Core</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(120, 0)">
      <rect x="-95" y="-18" width="190" height="36" rx="18" fill="#0B132B" stroke="#1E293B" stroke-width="1" />
      <circle cx="-72" cy="0" r="4" fill="#00F0FF" />
      <text x="-58" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#E2E8F0">Workforce Analytics</text>
    </g>

    <!-- Pill 4 -->
    <g transform="translate(360, 0)">
      <rect x="-95" y="-18" width="190" height="36" rx="18" fill="#0B132B" stroke="#1E293B" stroke-width="1" />
      <circle cx="-72" cy="0" r="4" fill="#10B981" />
      <text x="-58" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#E2E8F0">Global Talent Cloud</text>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="symBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080E10" />
      <stop offset="50%" stop-color="#0B1F1C" />
      <stop offset="100%" stop-color="#0F1416" />
    </linearGradient>

    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FFA3" />
      <stop offset="100%" stop-color="#00D4FF" />
    </linearGradient>

    <radialGradient id="symGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00FFA3" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#00D4FF" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#00FFA3" stop-opacity="0" />
    </radialGradient>

    <filter id="pegasusGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="400" height="400" fill="url(#symBg)" rx="40" />
  <rect width="400" height="400" fill="url(#symGlow)" rx="40" />
  <rect x="2" y="2" width="396" height="396" rx="38" fill="none" stroke="#00FFA3" stroke-width="1.5" stroke-opacity="0.5" />

  <!-- Outer Ring -->
  <circle cx="200" cy="200" r="160" fill="#0B1F1C" stroke="url(#neonCyan)" stroke-width="3" filter="url(#pegasusGlow)" />
  <circle cx="200" cy="200" r="142" fill="#080E10" stroke="#00FFA3" stroke-width="1" stroke-opacity="0.4" stroke-dasharray="8,6" />

  <!-- Circuit nodes around circle -->
  <circle cx="200" cy="40" r="3.5" fill="#00FFA3" />
  <circle cx="200" cy="360" r="3.5" fill="#00FFA3" />
  <circle cx="40" cy="200" r="3.5" fill="#00FFA3" />
  <circle cx="360" cy="200" r="3.5" fill="#00FFA3" />

  <!-- Pegasus Mascot -->
  <g transform="translate(130, 125) scale(1.5)" stroke="url(#neonCyan)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#pegasusGlow)">
    <!-- Wings -->
    <path d="M 45 42 C 35 25, 20 8, 5 2 C 15 15, 28 28, 40 45" stroke="#00FFA3" stroke-width="2.5" fill="#00FFA3" fill-opacity="0.12" />
    <path d="M 40 45 C 30 32, 12 18, -2 15 C 10 28, 25 38, 38 52" stroke="#00FFA3" stroke-width="2" />
    <path d="M 38 52 C 28 42, 10 32, -4 32 C 8 42, 22 50, 36 60" stroke="#00D4FF" stroke-width="1.8" />
    <path d="M 36 60 C 25 55, 12 50, 2 52 C 14 58, 24 64, 38 68" stroke="#00D4FF" stroke-width="1.6" />

    <!-- Body & Neck -->
    <path d="M 38 68 C 45 68, 55 62, 62 50 C 68 40, 72 28, 75 18 C 76 14, 78 12, 82 14 C 85 16, 84 20, 80 26 C 76 32, 74 38, 72 45" />
    
    <!-- Head & Horn -->
    <path d="M 82 14 C 84 10, 88 8, 92 12 C 90 16, 86 18, 80 20" stroke="#00FFA3" stroke-width="2.2" />
    <path d="M 85 11 L 88 6" stroke="#00D4FF" stroke-width="1.5" />
    <circle cx="85" cy="14" r="1.2" fill="#00FFA3" />

    <!-- Forelegs -->
    <path d="M 62 50 C 65 58, 72 65, 78 68 C 84 70, 90 68, 92 62" />
    <path d="M 78 68 L 84 78 L 94 76" stroke="#00D4FF" stroke-width="1.8" />
    <path d="M 58 55 C 62 65, 68 76, 75 82 L 82 80" stroke="#00FFA3" stroke-width="1.6" />

    <!-- Hindquarters & Legs -->
    <path d="M 38 68 C 30 70, 22 72, 16 78 C 10 85, 12 94, 8 100" />
    <path d="M 16 78 C 20 86, 26 95, 28 104 L 35 106" stroke="#00D4FF" stroke-width="2" />
    
    <!-- Tail -->
    <path d="M 12 76 C 5 80, -2 88, -8 98" stroke="#00FFA3" stroke-width="2" />
    <path d="M 10 79 C 2 86, -6 95, -12 108" stroke="#00D4FF" stroke-width="1.6" />
    <path d="M 8 82 C 4 92, -2 102, -8 114" stroke="#00FFA3" stroke-width="1.2" />
  </g>
</svg>
